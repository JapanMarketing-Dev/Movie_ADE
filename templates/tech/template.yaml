# 技術動画。1回の画面収録から、YouTube の本編（16:9）と、縦型の TikTok・YouTube Shorts（9:16）の3本を作る。
id: tech
version: 2
extends: base-horizontal
name: { ja: 技術動画（YouTube＋TikTok＋Shorts）, en: Tech video (YouTube + TikTok + Shorts) }
description:
  ja: 画面収録の解説動画。操作している箇所へ自動でズームし、キー操作を表示する。顔は右下の丸ワイプ、章の頭はカメラのみ
  en: Screen-recorded tutorial. Auto-zoom to the operated area, keystroke display, circular face wipe, camera-only at chapter starts
kind: tech
targets: [youtube]
canvas: { width: 1920, height: 1080, fps: 30 }

record:
  tracks: [screen, camera, mic]
  camera: { width: 1920, height: 1080, fps: 30 }
  screen: { fps: 30 }
  cursorLog: true   # 自動ズーム・クリックの輪に使う
  keyLog: true      # キー表示に使う（パスワード入力欄では記録しない）

layouts:
  default: screen-with-wipe
  allowed: [screen-with-wipe, screen-full, camera-full, scene]
  wipe: { shape: circle, corner: br, style: circle-gradient }

cut:
  # 画面を見せながら話すので、語りより間を少し長めに残す（操作の結果を目で追う時間）
  silence: { minMs: 600, padMs: 150 }
  retakes: keep-last
  ngMarkers: cut
  minKeepMs: 400

captions:
  maxCharsPerLine: 26
  maxLines: 2
  position: { anchor: bottom, y: 0.93 }

audio:
  sfx: { maxPerMinute: 3, gainDb: -16 }

decisions:
  # 画面の操作を切ると手順が抜けるので、自動で切るしきい値を語りより厳しくする
  cutKeep: { autoAbove: 0.75, autoBelow: 0.25 }

# 画面とカメラの切り替え（全画面・ワイプ・カメラのみ）の長さ
multicam: { maxShotSec: 90, minShotSec: 3 }

features:
  autoZoom: true
  keystrokes: true
  cursorHighlight: true
  piiMask: true

checks: [black-frames, freeze, loudness, spec, audio-clicks, cut-boundaries, caption-safe-area, pii-on-screen, mosaic-tracking, camera-switch]

# 1回の撮影から3本（docs/18）。本編（YouTube 16:9）から、縦型の2本を派生させる。
outputs:
  youtube:        { }
  tiktok:         { derive: vertical, maxSec: 90, captions: tiktok-bold, layout: split-v }
  youtube-shorts: { derive: vertical, sameAs: tiktok, maxSec: 60, captions: tiktok-bold, layout: split-v, hook: shorts }

pipeline: [ingest, sync, transcribe, rough-cut, multicam, captions, sfx, layout, preview, check, thumbnail, metadata, review, final]
