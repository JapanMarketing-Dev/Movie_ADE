name: Release
# Builds installers on each OS when a version tag is pushed and attaches them to a draft GitHub Release.
# Publishing to downloads.solocut.app (signing SHA256SUMS, uploading to R2, promoting latest.json) is done
# locally with `node scripts/release.mjs <version>`, so the signing key never leaves the maintainer's machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: pnpm --filter @solocut/desktop ${{ matrix.target == 'mac' && 'dist:mac:all' || format('dist:{0}', matrix.target) }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SOLOCUT_REBUILD_NATIVE: ${{ matrix.target == 'linux' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: solocut-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-{0}', github.run_number) }}
