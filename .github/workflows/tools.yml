name: Build tools
# Builds whisper-cli (whisper.cpp, MIT) for every platform Solocut supports. The binaries are attached to a
# draft release `tools-whisper-<version>` and then mirrored to downloads.solocut.app/tools/ by the maintainer;
# packages/toolchain pins their sha256.
on:
  workflow_dispatch:
    inputs:
      version:
        description: whisper.cpp tag
        default: v1.9.5
permissions:
  contents: write
jobs:
  whisper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: mac-arm64, cmake: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON' }
          - { os: macos-latest, name: mac-x64, cmake: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_METAL=OFF' }
          - { os: ubuntu-22.04, name: linux-x64, cmake: '' }
          - { os: ubuntu-22.04-arm, name: linux-arm64, cmake: '' }
          - { os: windows-latest, name: win-x64, cmake: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.version }}
      - name: Build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF ${{ matrix.cmake }}
          cmake --build build --config Release -j 4 --target whisper-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p out/whisper
          if [ "$RUNNER_OS" = "Windows" ]; then cp build/bin/Release/whisper-cli.exe out/whisper/; else cp build/bin/whisper-cli out/whisper/; fi
          cp LICENSE out/whisper/LICENSE-whisper.cpp.txt
          cd out && 7z a ../whisper-cli-${{ inputs.version }}-${{ matrix.name }}.zip whisper >/dev/null || zip -r ../whisper-cli-${{ inputs.version }}-${{ matrix.name }}.zip whisper
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.name }}
          path: whisper-cli-*.zip
  release:
    needs: whisper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: tools-whisper-${{ inputs.version }}
          files: dist/*
